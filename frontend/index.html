<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - EduTrack AI</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .login-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-card {
            width: 100%;
            max-width: 400px;
        }
        .login-header {
            text-align: center;
            margin-bottom: 2rem;
        }
        .login-header h1 {
            color: var(--primary);
            margin-bottom: 0.5rem;
        }
        .error-msg {
            color: var(--color-red-500, #ef4444);
            font-size: 0.875rem;
            margin-top: 1rem;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>

    <div class="login-container">
        <div class="card login-card glass">
            <div class="login-header">
                <h1>EduTrack AI</h1>
                <p>Bem-vindo(a) de volta! Faça seu login.</p>
            </div>
            
            <form id="loginForm">
                <div class="input-group">
                    <label for="email">E-mail</label>
                    <input type="email" id="email" class="input-control" placeholder="ex: aluno@edutrack.ai" required>
                </div>
                <div class="input-group">
                    <label for="password">Senha</label>
                    <input type="password" id="password" class="input-control" placeholder="Sua senha secreta" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Entrar</button>
                <div style="text-align: center; margin-top: 1.5rem; font-size: 0.875rem;">
                    <span style="color: var(--text-secondary);">Ainda não tem conta?</span>
                    <a href="signup.html" style="color: var(--primary); font-weight: 500; margin-left: 0.25rem;">Cadastre-se</a>
                </div>
                <div id="errorMsg" class="error-msg">Email ou senha incorretos.</div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script>
        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            
            const btn = e.target.querySelector('button');
            btn.innerText = 'Autenticando...';
            btn.disabled = true;

            try {
                // Using our Mock API
                const response = await window.api.login(email, password);
                if (response && response.token) {
                    localStorage.setItem('user', JSON.stringify(response.user));
                    localStorage.setItem('token', response.token);
                    window.location.href = 'dashboard.html';
                }
            } catch (error) {
                document.getElementById('errorMsg').style.display = 'block';
                btn.innerText = 'Entrar';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
