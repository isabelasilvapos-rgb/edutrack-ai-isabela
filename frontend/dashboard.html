<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - EduTrack AI</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .subjects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            margin-top: 2rem;
        }
        .subject-card {
            cursor: pointer;
        }
        .subject-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 1rem;
        }
        .subject-title {
            font-size: 1.25rem;
            margin-bottom: 0.25rem;
        }
        .progress-info {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            color: var(--text-secondary);
            margin-top: 1rem;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">EduTrack AI</div>
        <div class="nav-actions">
            <span id="userName" style="font-weight: 500;">Olá, Estudante</span>
            <button id="theme-toggle" class="theme-toggle">🌙</button>
            <a href="#" id="logout-btn" style="color: var(--text-secondary); margin-left: 1rem;">Sair</a>
        </div>
    </nav>

    <div class="container">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2>Minhas Disciplinas</h2>
            <button id="openNewSubjectModal" class="btn btn-primary">+ Nova Disciplina</button>
        </div>

        <div id="subjectsGrid" class="subjects-grid">
            <!-- Cards will be injected here by JS -->
            <p>Carregando disciplinas...</p>
        </div>
    </div>

    <!-- Modal de Cadastro -->
    <div id="modalOverlay" class="modal-overlay hidden" aria-hidden="true">
        <div class="modal-card">
            <div class="modal-header">
                <div>
                    <h3 id="modalTitle">Adicionar Nova Disciplina</h3>
                    <p id="modalSubtitle">Preencha os dados para incluir uma nova disciplina.</p>
                </div>
                <button type="button" class="icon-button" data-close="true" aria-label="Fechar modal">×</button>
            </div>
            <form id="subjectForm" class="modal-form">
                <div id="subjectFormSection" class="modal-section">
                    <div class="input-group">
                        <label for="subjectName">Nome da Disciplina</label>
                        <input id="subjectName" name="subjectName" type="text" class="input-control" data-required="true" placeholder="Ex: Matemática Aplicada">
                        <span class="input-error"></span>
                    </div>
                    <div class="input-group">
                        <label for="subjectProfessor">Nome do Professor</label>
                        <input id="subjectProfessor" name="subjectProfessor" type="text" class="input-control" data-required="true" placeholder="Ex: Prof. Carvalho">
                        <span class="input-error"></span>
                    </div>
                    <div class="input-group">
                        <label for="subjectWorkload">Carga Horária (h)</label>
                        <input id="subjectWorkload" name="subjectWorkload" type="number" min="1" class="input-control" data-required="true" placeholder="Ex: 60">
                        <span class="input-error"></span>
                    </div>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" data-close="true">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar Disciplina</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/app.js"></script>
    <script src="js/modals.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const user = JSON.parse(localStorage.getItem('user'));
            if (user) {
                document.getElementById('userName').innerText = `Olá, ${user.name}`;
            }

            const grid = document.getElementById('subjectsGrid');
            
            try {
                const subjects = await getSubjectsList();
                const allTasks = await getAllTasksList();
                
                grid.innerHTML = ''; // clear loading

                if(subjects.length === 0) {
                    grid.innerHTML = '<p>Você não possui disciplinas cadastradas.</p>';
                    return;
                }

                const renderSubjectCards = (subjects, allTasks) => {
                    grid.innerHTML = '';
                    if(subjects.length === 0) {
                        grid.innerHTML = '<p>Você não possui disciplinas cadastradas.</p>';
                        return;
                    }

                    subjects.forEach(subject => {
                        // Filter tasks for this subject to calculate progress
                        const subjectTasks = allTasks.filter(t => t.subject_id === subject.id);
                        const progress = window.calculateProgress(subjectTasks);
                        
                        const card = document.createElement('div');
                        card.className = 'card subject-card glass';
                        card.onclick = () => window.location.href = `subject.html?id=${subject.id}`;
                        
                        card.innerHTML = `
                            <div class="subject-header">
                                <div>
                                    <h3 class="subject-title">${subject.name}</h3>
                                    <p style="font-size: 0.875rem; color: var(--text-secondary);">${subject.professor}</p>
                                </div>
                                <span class="status-badge status-active">${subject.status}</span>
                            </div>
                            <p style="font-size: 0.875rem; margin-bottom: 1rem;">Carga Horária: ${subject.workload}h</p>
                            
                            <div class="progress-info">
                                <span>Progresso</span>
                                <span style="font-weight: 600; color: var(--primary);">${progress}%</span>
                            </div>
                            <div class="progress-container">
                                <div class="progress-bar" style="width: ${progress}%"></div>
                            </div>
                        `;
                        grid.appendChild(card);
                    });
                };

                renderSubjectCards(subjects, allTasks);
                window.refreshSubjectCards = async (updatedSubjects) => {
                    const latestTasks = await getAllTasksList();
                    renderSubjectCards(updatedSubjects, latestTasks);
                };
            } catch (err) {
                console.error(err);
                grid.innerHTML = '<p>Erro ao carregar disciplinas.</p>';
            }
        });
    </script>
</body>
</html>
