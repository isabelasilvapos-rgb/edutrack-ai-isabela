<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da Disciplina - EduTrack AI</title>
    <link rel="stylesheet" href="css/styles.css">
    <style>
        .page-header {
            margin-bottom: 2rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }
        .back-link {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            background-color: var(--surface-color);
            box-shadow: var(--shadow);
            color: var(--primary);
            font-size: 1.25rem;
            transition: all 0.2s;
        }
        .back-link:hover {
            transform: translateX(-4px);
        }
        
        .tasks-list {
            margin-top: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }
        .task-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 1rem;
            background-color: var(--surface-color);
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            transition: opacity 0.2s;
        }
        .task-item.completed {
            opacity: 0.6;
        }
        .task-item.completed .task-title {
            text-decoration: line-through;
            color: var(--text-secondary);
        }
        .task-checkbox {
            width: 24px;
            height: 24px;
            cursor: pointer;
            accent-color: var(--primary);
        }
        .task-title {
            font-weight: 500;
            flex-grow: 1;
        }
        .header-progress {
            background-color: var(--surface-color);
            padding: 1.5rem;
            border-radius: var(--radius);
            box-shadow: var(--shadow);
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>

    <nav class="navbar">
        <div class="brand">EduTrack AI</div>
        <div class="nav-actions">
            <button id="theme-toggle" class="theme-toggle">🌙</button>
            <a href="dashboard.html" style="color: var(--text-secondary); margin-left: 1rem;">Voltar</a>
        </div>
    </nav>

    <div class="container">
        <div class="page-header">
            <a href="dashboard.html" class="back-link">←</a>
            <div>
                <h2 id="subjectName">Carregando disciplina...</h2>
                <p id="subjectDesc" style="color: var(--text-secondary);">Detalhes das atividades</p>
            </div>
        </div>

        <div class="header-progress glass">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                <span style="font-weight: 600;">Progresso da Disciplina</span>
                <span id="progressText" style="font-weight: 700; color: var(--primary); font-size: 1.25rem;">0%</span>
            </div>
            <div class="progress-container">
                <div id="progressBar" class="progress-bar" style="width: 0%"></div>
            </div>
        </div>

        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
            <h3>Tarefas Acadêmicas</h3>
            <button id="openNewTaskModal" class="btn btn-primary">+ Nova Tarefa</button>
        </div>

        <div id="tasksList" class="tasks-list">
            <p>Carregando tarefas...</p>
        </div>
    </div>

    <!-- Modal de Cadastro -->
    <div id="modalOverlay" class="modal-overlay hidden" aria-hidden="true">
        <div class="modal-card">
            <div class="modal-header">
                <div>
                    <h3 id="modalTitle">Adicionar Nova Tarefa</h3>
                    <p id="modalSubtitle">Insira detalhes para a tarefa vinculada à disciplina.</p>
                </div>
                <button type="button" class="icon-button" data-close="true" aria-label="Fechar modal">×</button>
            </div>
            <form id="taskForm" class="modal-form">
                <div class="modal-section">
                    <div class="input-group">
                        <label for="taskName">Nome da Tarefa</label>
                        <input id="taskName" name="taskName" type="text" class="input-control" data-required="true" placeholder="Ex: Estudar capítulo 5">
                        <span class="input-error"></span>
                    </div>
                    <div class="input-group">
                        <label for="taskSubjectRef">Disciplina Relacionada</label>
                        <input id="taskSubjectRef" name="taskSubjectRef" type="text" class="input-control" data-required="true" readonly>
                        <span class="input-error"></span>
                    </div>
                    <input id="taskSubjectId" name="taskSubjectId" type="hidden">
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn btn-secondary" data-close="true">Cancelar</button>
                    <button type="submit" class="btn btn-primary">Salvar Tarefa</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/progress.js"></script>
    <script src="js/app.js"></script>
    <script src="js/modals.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            // Get Subject ID from URL query string
            const urlParams = new URLSearchParams(window.location.search);
            const subjectId = urlParams.get('id');

            if (!subjectId) {
                window.location.href = 'dashboard.html';
                return;
            }

            const tasksList = document.getElementById('tasksList');
            let currentTasks = [];

            const subjectTitleEl = document.getElementById('subjectName');

            try {
                // Fetch Subject Name
                const subjects = await getSubjectsList();
                const subject = subjects.find(s => s.id === parseInt(subjectId));
                if(subject) {
                    document.getElementById('subjectName').innerText = subject.name;
                    document.getElementById('subjectDesc').innerText = `Professor(a): ${subject.professor}`;
                    if (typeof hydrateTaskModal === 'function') {
                        hydrateTaskModal(subjectId, subject.name);
                    }
                }

                // Fetch Tasks
                currentTasks = await getTasksBySubjectId(subjectId);
                renderTasks();
                
            } catch (err) {
                console.error(err);
                tasksList.innerHTML = '<p>Erro ao carregar dados.</p>';
            }

            function updateProgressUI() {
                const progress = window.calculateProgress(currentTasks);
                document.getElementById('progressText').innerText = `${progress}%`;
                document.getElementById('progressBar').style.width = `${progress}%`;
            }

            function renderTasks() {
                tasksList.innerHTML = '';
                
                if(currentTasks.length === 0) {
                    tasksList.innerHTML = '<p>Nenhuma tarefa cadastrada nesta disciplina.</p>';
                } else {
                    currentTasks.forEach(task => {
                        const div = document.createElement('div');
                        div.className = `task-item ${task.is_completed ? 'completed' : ''}`;
                        
                        div.innerHTML = `
                            <input type="checkbox" class="task-checkbox" ${task.is_completed ? 'checked' : ''} data-id="${task.id}">
                            <span class="task-title">${task.title}</span>
                            <span style="font-size: 0.75rem; color: var(--text-secondary);">ID: ${task.id}</span>
                        `;
                        tasksList.appendChild(div);
                    });

                    // Add event listeners to checkboxes
                    document.querySelectorAll('.task-checkbox').forEach(box => {
                        box.addEventListener('change', async (e) => {
                            const taskId = e.target.getAttribute('data-id');
                            const isCompleted = e.target.checked;
                            
                            // Update UI optimistically
                            const taskItem = e.target.closest('.task-item');
                            if(isCompleted) taskItem.classList.add('completed');
                            else taskItem.classList.remove('completed');

                            // Update local array state and progress
                            const taskObj = currentTasks.find(t => t.id === parseInt(taskId));
                            if(taskObj) taskObj.is_completed = isCompleted;
                            updateProgressUI();

                            // Simulate API call
                            await window.api.toggleTaskCompletion(taskId, isCompleted);
                        });
                    });
                }
                updateProgressUI();
            }

            window.refreshTaskList = (updatedTasks) => {
                currentTasks = updatedTasks;
                renderTasks();
            };
        });
    </script>
</body>
</html>
